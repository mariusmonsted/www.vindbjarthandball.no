name: Hent kamper fra handball.no
on:
  schedule:
    - cron: '0 3 * * *'    # hver natt kl. 04/05 norsk tid
    - cron: '0 11 * * 6,0' # ekstra oppdatering lørdag og søndag midt på dagen
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node hent-kamper.mjs
      - run: |
          git config user.name "kampsenter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/kamper.json
          git diff --cached --quiet || git commit -m "Oppdater kamper $(date -u +%F)"
          git push
